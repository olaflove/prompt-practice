spring:
  config:
    import: optional:file:../.env[.properties]
  application:
    name: backend
  datasource:
    url: jdbc:REDACTEDql://localhost:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.REDACTEDql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  jooq:
    sql-dialect: POSTGRES

server:
  port: 8080
